}
*{box-sizing:border-box}

 : 10/23\n5. 2027년 연도변경 자동화, 등록 : 10/30"]}, "ins": {"2026-02": "1. 핵심 유입 채널 부진\nOrganic Search·Paid Search·Direct 채널의 전년 대비 큰 폭 감소가 전체 트래픽 하락의 주요 원인입니다.\n반면 Organic Social만 유일하게 증가세를 보였습니다.\n→ 검색 채널 회복 전략과 소셜 채널 확대 전략이 동시에 필요합니다.\n\n2. 매출의 단일 제품 집중도 심화\n총 신규 결제 금액의 약 53%가 단일 제품에서 발생하며 매출 편중 현상이 심화되고 있습니다.\n→ 특정 제품 의존도를 낮추고, 2·3위 제품군 매출 확대 전략이 필요합니다.", "2026-03": "1. 유입 증가 대비 매출 전환 저하\n방문자 수는 전월 대비 크게 증가했으나, 신규 결제 금액은 전월·전년 대비 모두 감소하며 전환 효율이 하락했습니다.\n특히 전환수는 소폭 증가했음에도 월정액 비중 확대에 따른 객단가 하락이 전체 매출 감소의 주요 원인으로 작용했습니다.\n→ 유입 확대 성과를 매출로 연결하기 위한 전환율 개선 및 객단가 방어 전략이 필요합니다.\n\n2. 핵심 상품 중심 매출 구조 강화 필요\n일부 상위 템플릿이 판매량과 매출 모두를 견인하며 매출 구조가 특정 상품에 집중되는 경향을 보였습니다.\n특히 대용량 비즈니스 템플릿과 고가 회사소개서 상품이 매출 상위권을 형성하며 성과를 주도했습니다.\n→ 핵심 상품의 노출 및 마케팅을 강화하는 동시에, 고단가 상품 확대 전략이 병행되어야 합니다.\n\n3. 신규 콘텐츠 및 상세페이지 개선을 통한 반등 준비\n다음 달 신규 템플릿 제작 및 트렌드 리포트 콘텐츠 확장이 예정되어 있으며, 기존 상품 상세페이지 개선도 함께 추진됩니다.\n이는 콘텐츠 경쟁력 강화와 구매 전환율 개선을 동시에 노리는 전략으로 해석됩니다.\n→ 신규 콘텐츠 공급과 상세페이지 최적화를 통한 매출 반등 전략이 필요합니다.", "2026-04": "1. 계절적 비수기 진입에 따른 매출 감소 확대\n4월은 비수기 시작 구간으로, 전년도에도 3월 대비 약 45% 수준의 매출 감소가 발생한 바 있습니다.\n금월 역시 방문자 수와 결제 수가 전월 대비 감소하며 전반적인 유입 규모가 축소되었고, 이에 따라 신규 결제 금액도 큰 폭으로 하락했습니다.\n→ 비수기 구간을 고려한 트래픽 방어 및 시즌성 콘텐츠 전략이 필요합니다.\n\n2. 월정액 중심 결제 구조로 인한 객단가 하락\n신규 결제 72건 중 59건이 월정액으로 약 82% 비중을 차지하며 결제 구조가 저가 결제 중심으로 집중되었습니다.\n결제 전환 자체는 유지되고 있으나, 대부분이 월정액에 집중되면서 전체 매출 감소폭이 확대된 것으로 분석됩니다.\n→ 월정액 유입을 유지하면서 연간 플랜 및 고가 상품으로의 전환을 유도하는 객단가 개선 전략이 필요합니다.\n\n3. 콘텐츠 개선 및 신규 제작을 통한 반등 기반 마련중\n트렌드 리포트 정기 업로드 및 상세페이지 개선 작업이 진행되며 콘텐츠 경쟁력 강화가 지속되고 있습니다.\n또한 키워드 랜딩페이지 변경을 통해 유입 효율 개선이 기대되는 상황입니다.\n→ 기존 콘텐츠 최적화와 신규 콘텐츠 확대를 병행하여 전환율 및 매출 반등 전략이 필요합니다.", "2026-05": "1. 연간 결제 확대를 통한 매출 성장\n5월은 방문자 수와 결제 건수가 감소했음에도 불구하고, 2년 결제 등 장기결제 비중 증가로 전월 대비 매출이 약 9.6% 상승했습니다.\n→ 고수익 상품 중심의 판매 전략과 장기 결제 유도 프로모션 강화가 필요합니다.\n\n2. 광고 효율 개선 및 수익성 향상\n광고비를 전월 대비 약 18% 절감했음에도 매출이 증가하며 광고 운영 효율이 개선되었습니다.\n→ 고효율 광고 채널 유지 및 ROAS 중심의 광고 예산 운영이 필요합니다.\n\n3. 대형 콘텐츠를 활용한 검색 유입 확대 필요\n5월 말 진행된 콘텐츠 마케팅 활동과 예정된 1,000장 템플릿 출시가 신규 유입 확대의 핵심 요소가 될 것으로 예상됩니다.\n→ 대용량 템플릿 및 시즌성 콘텐츠를 활용한 SEO 중심의 유입 확대 전략이 필요합니다.", "2026-06": "1. 모달 팝업을 통한 매출 방어 및 전환율 개선\n방문자 수와 결제 건수는 감소했지만, 1,000장 템플릿 모달 팝업이 전체 결제의 43.4%, 매출의 45.2%를 차지하며 객단가를 높여 매출 감소폭을 최소화했습니다.\n→ 전환율이 높은 모달 팝업과 프로모션을 지속 운영하고, 시즌별 기획 프로모션을 확대할 필요가 있습니다.\n\n2. SEO 중심의 검색 유입 확대 필요\n구글 오가닉 유입은 안정적으로 유지된 반면, 네이버 오가닉 유입은 전년 대비 큰 폭으로 감소했습니다.\n→ SEO/AEO 최적화와 블로그·콘텐츠 마케팅을 강화해 네이버 및 검색 자연 유입을 확대할 필요가 있습니다.", "2026-07": "실무 목적형 템플릿의 구매 수요 확대\n정부지원사업, 재무·IR, 성과보고 등 활용 목적이 명확한 실무형 템플릿의 결제가 집중되었습니다.\n→ 시즌성과 실무 이슈를 반영한 보고서·제안서·사업계획서 중심의 콘텐츠를 지속 확대해 수요를 선점할 필요가 있습니다.", "2026-08": "1. 비수기 진입 이후 매출 하락세 지속\n4월 이후 실적 하락세가 지속되어 8월에는 목표 달성률이 38.67%까지 낮아졌습니다. 전년 동기 대비 누적 매출도 46.2% 감소했습니다.\n→ 하반기에는 시즌별 수요를 반영한 신규 콘텐츠와 프로모션을 선제적으로 운영해 매출 회복 구간을 만드는 전략이 필요합니다.\n\n2. 오가닉 검색 중심의 유입 구조 강화 필요\n1~8월 방문자는 전년 동기 대비 57.8% 감소했지만, Organic Search가 전체 유입의 약 40%를 유지하며 핵심 유입원 역할을 하고 있습니다. Organic Social도 소폭 증가하며 긍정적인 흐름을 보였습니다.\n→ 검색 유입을 안정적인 매출로 연결할 수 있도록 SEO 콘텐츠를 확대하고 SNS·블로그 등 오가닉 채널을 함께 강화할 필요가 있습니다.", "2026-09": "1. 방문자 감소에도 구매 효율은 개선\n9월 방문자는 전월 대비 22.2% 감소했지만, 구매 전환율은 2.04%, 객단가는 35,365원으로 상승해 매출 감소폭을 6.4%로 방어했습니다. 특히 프리미엄 템플릿이 첫결제 매출의 60.6%를 차지했습니다.\n→ 구매 수요가 확인된 실무형 프리미엄 상품을 중심으로 상품 경쟁력을 강화할 필요가 있습니다.\n\n2. 오가닉 검색 유입 감소에 따른 방문자 감소\n9월 방문자는 전년 동월 대비 73.6% 감소했으며, Google·Naver Organic도 각각 81.1%, 75.3% 감소했습니다. 검색 유입 감소가 전체 방문자 감소의 주요 요인으로 나타났습니다.\n→ 실무·시즌 키워드 중심의 SEO 콘텐츠와 블로그·SNS 연계를 강화해 검색 유입을 회복할 필요가 있습니다.\n\n3. 4분기 시즌·실무 수요 중심으로 집중\n9월에는 사업계획서·정부지원사업·행사 기획안 등 시기와 업무 수요가 명확한 상품에서 결제가 발생했습니다. 제작 자동화 기반도 마련되어 효율적인 콘텐츠 생산이 가능해졌습니다.\n→ 4분기에는 신년도 사업계획서·IR·성과평가 등 시즌 수요가 높은 상품을 선제적으로 제작하고, 고효율 상품에 리소스를 집중할 필요가 있습니다."}, "ga": {"2026-01": {"ch": [["Organic Search", 3053, 7970], ["Direct", 877, 1068], ["Organic Social", 827, 1283], ["Unassigned", 704, 1204], ["Referral", 564, 282]], "md": [["google / organic", 1546, 4457], ["naver / organic", 836, 1935], ["(direct) / (none)", 827, 1283], ["naverbs-pc / da", 804, 932], ["google / cpc", 616, 778]]}, "2026-02": {"ch": [["Organic Search", 2299, 8814], ["Unassigned", 633, 1766], ["Paid S const MU={
  num:v=>Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''))||0,
  ym:v=>{const m=String(v||'').match(/(\d{4})[-.\s]*(\d{1,2})/);return m?`${m[1]}-${('0'+m[2]).slice(-2)}`:''},
  dec:s=>String(s||'').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim(),
  top:(a,cmp)=>a.map((v,i)=>[v,i]).sort((A,B)=>cmp(A[0],B[0])||A[1]-B[1]).slice(0,10).map(v=>v[0])
};

  out.months=Object.keys(out.raw).filter(m=>m>='2026-01').sort();return out;

 광고를 재편하고, ROAS 기반의 광고 운영을 강화할 필요가 있습니다.", "1. 광고 효율 개선과 매출 성장\n광고비는 전월 대비 11.0% 증가에 그쳤지만, 결제 금액은 28.3%, 실매출은 38.6% 증가하며 광고 효율이 크게 개선되었습니다.\n→ ROAS가 높은 광고 운영을 유지하고, 전환율이 높은 상품 중심으로 광고를 확대할 필요가 있습니다.\n\n2. 엑셀 템플릿 확대를 통한 신규 매출 기반 확보\n신규 등록한 엑셀 템플릿이 판매로 이어지며 새로운 성장 가능성을 확인했습니다. 특히 실무 자동화 기능이 포함된 템플릿의 수요가 높게 나타났습니다.\n→ 실무형 엑셀 템플릿을 지속 확대할 필요가 있습니다."], "2026-07": ["1. 전월 대비 실적 회복세 \n방문자 수, 결제 건수, 결제 금액이 모두 전월 대비 11~24% 증가하며 단기적인 성장 흐름을 보였습니다. \n→ 신규 상품 확대와 검색 노출 강화를 통해 단기 회복세를 장기 성장으로 이어갈 필요가 있습니다.\n\n2. 광고 효율 개선으로 매출 증가\n광고비는 전월 대비 6.8% 감소했지만 결제 금액은 24.6% 증가하며 ROAS가 크게 개선되었습니다.\n→ AI 광고 최적화와 쇼핑광고 운영을 지속 개선해 적은 비용으로 높은 매출을 확보할 필요가 있습니다.", "1. 전월 대비 핵심 지표 모두 큰 폭 성장\n결제 건수, 결제 금액, 실매출이 모두 26~36% 증가하며 플랫폼 내 성장세가 뚜렷하게 나타났습니다.\n→ 현재의 상품 운영 전략을 유지하면서 인기 상품 중심의 노출을 확대할 필요가 있습니다.\n\n2. 신규 상품 확대가 매출 성장 견인\n엑셀 템플릿 21건 등록과 광고 추가 등 적극적인 상품 확장이 매출 증가에 긍정적인 영향을 미쳤습니다.\n→ PPT뿐 아니라 엑셀 등 실무형 콘텐츠를 지속 확대해 신규 고객 유입을 늘릴 필요가 있습니다."], "2026-08": ["1. 방문자 하락 대비 결제 전환율 하락\n방문자 수는 전월 대비 11.9% 하락했지만 결제수는 22.0%, 결제 금액은 28.5% 감소하며 유입수 하락대비 매출 하락폭이 조금 더 컸습니다.\n→ 유입 키워드와 상품 간 적합성 및 전환율 개선에 집중할 필요가 있습니다.\n\n2. 광고비 증가 대비 매출 효율 저하\n전년 대비 광고비는 50.9% 증가했지만 결제 금액은 69.0% 감소해 광고 효율이 크게 악화되었습니다.\n→ 광고별 전환 성과를 재점검하고, 저효율 광고·키워드를 정리해야 할 필요가 있습니다.", "1. 광고비 절감에도 결제수 증가\n전월 대비 광고비를 14.1% 줄였음에도 결제수는 18.9% 증가하며 광고 운영 효율이 개선되었습니다.\n→ 현재의 효율적인 광고 운영을 유지하면서 전환 성과가 높은 상품 중심으로 광고를 선별 운영할 필요가 있습니다.\n\n2. 결제수 증가 대비 객단가 하락\n결제수는 증가했지만 결제 금액은 4.7%, 실매출은 0.8% 감소해 건당 구매 금액이 낮아졌습니다. 엑셀 템플릿 등 상대적으로 저단가 상품의 판매 비중이 높아진 영향으로 보입니다.\n→ 저단가 상품 판매를 유지하되 묶음·패키지 상품을 확대해 객단가를 보완할 필요가 있습니다."], "2026-09": ["1. 스마트스토어 광고 효율 악화\n9월 매출은 전월과 유사했으나 광고 효율이 악화되었습니다. 특히 광고비가 매출의 66%를 차지해 광고 의존도가 높고, ROAS도 151%까지 하락했습니다.\n→ 효율이 낮은 광고를 정리하고 광고비를 축소해 수익성을 개선하는 동시에, SEO와 자연 유입을 확대할 필요가 있습니다.\n\n2. 주력 상품 의존도 완화 및 신규 상품 확대\n400장·300장 등 대용량 PPT가 매출을 견인하고 있지만, 건설 공사지명원처럼 특정 목적에 맞는 상품도 꾸준한 판매가 확인되고 있습니다.\n→ 기존 주력 상품과 특화 상품을 중심으로 신규 PPT를 확대하고, 번들 상품을 통해 상품군과 객단가를 함께 높일 필요가 있습니다.", "1. 400장 템플릿 판매수 증가와 엑셀 템플릿 확대로 매출·수익 동반 상승\n9월 매출 전월 대비 26.6% 증가했으며, 광고비의 절감으로     document.getElementById('wView').hidden=v!=='w';document.getElementById('mView').hidden=v!=='m';

  bt.forEach(b=>b.onclick=()=>set(b.dataset.v));

  set(v==='m'?'m':'w');

function renderInsights(w,pw){
  const name=s=>s.name.replace('씨티미디어 ','');
  const rows=ALL.map(s=>{const t=siteAgg(s,w),p=pw?siteAgg(s,pw):null;return{s,t,p,pc:p?pct(t.v,p.v):null}});

  const P=pw?rows.reduce((a,r)=>({n:a.n+r.p.n,v:a.v+r.p.v}),{n:0,v:0}):null;
  const sg=p=>`${p>=0?'+':'-'}${Math.abs(p).toFixed(1)}%`;
  const ins=[];const nm=r=>name(r.s);
  const man=v=>(Math.round(v/1e3)/10).toLocaleString('ko-KR')+'만원';
  const cls=p=>p>=0?'up':'dn';
  const col=p=>`<b class="${cls(p)}">${sg(p)}</b>`;
  const tot=wk=>ALL.reduce((a,s)=>{const t=siteAgg(s,wk);return{n:a.n+t.n,v:a.v+t.v}},{n:0,v:0});
  // 1) 총 매출
  const best=WEEKS.every(wk=>wk===w||tot(wk).v<=T.v);
  if(0)ins.push(['총 매출',`<b>${man(T.v)}</b>`+(P?` · 전주 대비 ${col(pct(T.v,P.v))}`:'')+(best&&WEEKS.length>1?' · 최근 4주 중 최고':'')]);
  // 2) 객단가
  const aovTxt=(P&&P.n&&T.n)?(()=>{const a1=P.v/P.n,a2=T.v/T.n;return ` · 객단가 ${won(a1)}원 → <b>${won(a2)}원</b> (${col(pct(a2,a1))})`})():'';
  // 3) 증감 기여
  if(P){const dT=T.v-P.v,mv=[...rows].sort((a,b)=>(dT>=0?1:-1)*((b.t.v-b.p.v)-(a.t.v-a.p.v)))[0],dm=mv.t.v-mv.p.v;
    const opp=rows.filter(r=>r.pc!=null&&(dT>=0?r.pc<0:r.pc>0));
    ins.push([dT>=0?'증가 요인':'감소 요인',`${dT>=0?'증가':'감소'}분 ${man(Math.abs(dT))} 중 ${nm(mv)} ${dT?Math.round(dm/dT*100):0}%`+aovTxt+(opp.length?` · ${opp.map(r=>`${nm(r)} ${col(r.pc)}`).join(', ')}`:'')]);}
  // 4) 예스폼 고액 결제
  const yl=yfWeek(w),yv=yl.reduce((a,x)=>a+x[1],0),big=yl.filter(x=>x[1]>=110000),bv=big.reduce((a,x)=>a+x[1],0),pbig=pw?yfWeek(pw).filter(x=>x[1]>=110000).length:null;

  // 5) 업무
  const tk=(typeof TASKS!=='undefined'?TASKS:[]).filter(t=>t[0]===w);
  if(tk.length||BLOG.some(b=>b[0]&&monday(b[0])===w)){const done=tk.filter(t=>t[2]==='완료').length+BLOG.filter(b=>b[0]&&monday(b[0])===w).length,left=tk.filter(t=>t[2]!=='완료'&&t[3]).sort((a,b)=>a[3]<b[3]?-1:1);

 {id:'sm',name:'슬라이드멤버스',hex:'#8A6FDB',i:5},

// 참고 대시보드처럼 증감은 색 글자로만 표시 (상승 빨강, 하락 파랑)

const wkLabel=w=>{const m=pd(w);return`${fmt(m)}~${fmt(new Date(+m+6*864e5))}`};
// KPI 아이콘 (선형, currentColor)
const SV=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

  '예':SV('<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'), // 예스폼 비중: 파이차트
  '신':SV('<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M19 8v6M16 11h6"/>'), // 신규 결제: 사용자 추가
  '大':SV('<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/>'), // 고액 결제: 보석
  'P':SV('<path d="m12 2 3 6.5 7 .8-5.2 4.8 1.5 6.9L12 17.6 5.7 21l1.5-6.9L2 9.3l7-.8z"/>') // 프리미엄: 별
};

const TONE={b:['#e1eefc','#4A86E8'],p:['#EFEAFB','#8A6FDB'],g:['#EEF6E3','#1e9e5a'],o:['#fdf0e1','#e07a00']};
const ICT={'₩':'b','건':'p','단':'g','예':'o','신':'p','大':'o','P':'b'};
const kpi=(ic,l,v,u,d)=>{const t=TONE[ICT[ic]||'b'];return`<article class="card kpi"><span class="ic" style="background:${t[0]};color:${t[1]}">${ICON[ic]||ic}</span><div><div class="kl">${l}</div><div class="kv"><b>${v}</b><u>${u}</u></div><div class="kd">${d}</div></div></article>`};
const typ=x=>x[4]>0?'신규':x[5]>0?'재결제':'구분없음';

function bars(W,H,groups,series,max,lbl){ // 그룹 막대: 선택 주차는 진하게, 나머지는 회색
  const L=44,R=8,T=12,B=26,gw=(W-L-R)/groups.length,k=series.length,bw=Math.min(26,(gw-20)/k);
  const y=v=>T+(1-v/max)*(H-T-B);let g='';
  for(let t=0;t<=4;t++){const v=max*t/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v/1e4)}</text>`}
  groups.forEach((gp,i)=>{const cx=L+gw*i+gw/2,on=i===wi;
    series.forEach((s,j)=>{const v=gp.v[j],x=cx-k/2*bw+j*bw;
      g+=`<rect x="${x+2}" y="${y(v)}" width="${bw-4}" height="${Math.max(0,y(0)-y(v))}" rx="2.5" fill="${on?s.hex:'var(--bar0)'}"><title>${s.name} ${gp.l} ${won(v)}원</title></rect>`});
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="12" fill="${on?'var(--fg)':'var(--mute)'}" font-weight="${on?600:400}">${gp.l}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="${lbl}">${g}</svg>`;
}

function renderYF(w,pw){
  const l=yfWeek(w),p=pw?yfWeek(pw):[];
  const sum=a=>a.reduce((s,x)=>s+x[1],0),cnt=(a,f)=>a.filter(f).length;
  const v=sum(l),pv=sum(p),n=l.length,pn=p.length;
  const big=l.filter(x=>x[1]>=110000),bigV=sum(big),pbig=cnt(p,x=>x[1]>=110000);
  const nw=cnt(l,x=>typ(x)==='신규'),pnw=cnt(p,x=>typ(x)==='신규');
  // 목표 달성률: 주간 20건, 월간 = 20건 × 그 달 월요일 수 (선택 주차의 끝날까지 누적)
  {const GW=20,ms=w.slice(0,7),we=new Date(+pd(w)+6*864e5).toISOString().slice(0,10);
   const yy=+ms.slice(0,4),mm=+ms.slice(5),dim=new Date(Date.UTC(yy,mm,0)).getUTCDate();let mon=0;for(let d=1;d<=dim;d++)if(new Date(Date.UTC(yy,mm-1,d)).getUTCDay()===1)mon++;
   const GM=GW*mon,mn=YF.filter(x=>String(x[0]).slice(0,7)===ms&&x[0]<=we).length;
   const bar=(lb,c,t,sub)=>{const r=t?c/t*100:0;return`<div class="gi"><div class="gt"><span>${lb}</span><b class="${r>=100?'ok':''}">${r.toFixed(0)}%</b></div><div class="gb"><span style="width:${Math.min(100,r)}%"></span></div><div class="gnote"><b>${c}</b>건 / 목표 ${t}건 · ${sub}</div></div>`};
   document.getElementById('goal').innerHTML=bar('주간',n,GW,n>=GW?'목표 달성':`${GW-n}건 남음`)+bar(`월간 (${mm}월 누적)`,mn,GM,`${mm}월 ${we.slice(5)===ms.slice(5)?'':''}${+we.slice(8)}일까지`);}
  const pre=cnt(l,x=>x[9]?['1YP','2YP','1ME','1MP'].includes(String(x[9]).toUpperCase()):x[2]==='프리미엄');

  // 전체 성과와 같은 카드 형식 (아이콘 없음)
  const arr=(c,pc)=>pw==null?'<span>전주 비교 없음</span>':(c===pc?'<span>전주와 같음</span>':`<span class="${c>pc?'up':'dn'}">${c>pc?'+':'-'}${Math.abs(c-pc)}건</span>`);
  const k2=(l,c,pc,sub)=>`<article class="card k2"><div class="kl">${l}</div><div class="kv"><b>${c}</b><u>건</u></div><div class="kd">${arr(c,pc)} · ${sub}</div></article>`;
  const ppre=cnt(p,x=>x[9]?['1YP','2YP','1ME','1MP'].includes(String(x[9]).toUpperCase()):x[2]==='프리미엄');
  // 예스폼 전체 실결제 금액(수수료 제외)과 파워포인트 비중 — 7일치가 모두 있는 주만 계산
  const ytw=wk=>{if(!wk)return null;const d=YFT.filter(x=>monday(x[0])===wk);return d.length>=7?d.reduce((a,x)=>a+x[1],0):null};
  const yt=ytw(w),pyt=ytw(pw),share=yt?v/yt*100:null,pshare=pyt?pv/pyt*100:null;
  const kp=(l,val,u,d)=>`<article class="card k2"><div class="kl">${l}</div><div class="kv"><b>${val}</b><u>${u}</u></div><div class="kd">${d}</div></article>`;
  const ytCard=yt==null?kp('예스폼 전체 매출 <small class="gsub">수수료 제외</small>','-','','이 주는 실결제 자료 없음'):kp('예스폼 전체 매출 <small class="gsub">수수료 제외</small>',won(yt),'원',pyt?`<span class="${yt>=pyt?'up':'dn'}">${yt>=pyt?'+':'-'}${Math.abs(pct(yt,pyt)).toFixed(1)}%</span> · 지난주 ${won(pyt)}원`:'전주 비교 없음');
  const shCard=share==null?kp('예스폼 파워포인트 비중','-','','이 주는 실결제 자료 없음'):kp('예스폼 파워포인트 비중',share.toFixed(2),'%',(pshare!=null?`지난주 ${pshare.toFixed(2)}%`:'전주 비교 없음'));
  const adW=wk=>{if(!wk)return null;const l=ADSW.filter(x=>monday(x[0])===wk);return l.length?{v:l.reduce((a,x)=>a+x[2],0),part:l.some(x=>x[0]!==wk)}:null};
  const ad0=adW(w),ad1=adW(pw),usdW=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const adCard=ad0==null?kp('구글 애드센스 <small class="gsub">슬라이드멤버스</small>','-','','이 주는 데이터 없음'):kp('구글 애드센스 <small class="gsub">슬라이드멤버스</small>',usdW(ad0.v),'',(ad1?`<span class="${ad0.v>=ad1.v?'up':'dn'}">${ad0.v>=ad1.v?'+':'-'}${Math.abs(pct(ad0.v,ad1.v)).toFixed(1)}%</span> · 지난주 ${usdW(ad1.v)}`:'전주 비교 없음')+(ad0.part?' · 일부 기간':''));
  document.getElementById('yfTop').innerHTML=ytCard+shCard;document.getElementById('adTop').innerHTML=adCard;
  document.getElementById('yfKpis').innerHTML=
    k2('신규 결제',nw,pnw,`재결제 ${cnt(l,x=>typ(x)==='재결제')}건`)+
    k2('연간 결제 (110,000원 이상)',big.length,pbig,`매출의 ${v?(bigV/v*100).toFixed(1):0}%`)+
    k2('프리미엄 가입',pre,ppre,`전체 결제의 ${n?(pre/n*100).toFixed(0):0}%`);

  const ins=[];
  ins.push(['매출',pw?`${won(v)}원, 전주보다 ${dl(pct(v,pv),'').trim()}. 결제수 ${pn}건 → ${n}건`:`${won(v)}원, 결제 ${n}건`]);
  ins.push(['연간 결제',big.length?`110,000원 이상 ${big.length}건이 매출의 ${(bigV/v*100).toFixed(1)}% (전주 ${pbig}건)`:`110,000원 이상 결제 없음 (전주 ${pbig}건). 9,900·11,000원 결제만으로는 매출이 크게 오르지 않음`]);
  ins.push(['신규 결제',`${nw}건, 결제의 ${n?(nw/n*100).toFixed(0):0}%${pw?` (전주 ${pnw}건)`:''}`]);
  const cc=CATS.map(c=>[c,cnt(l,x=>x[6]===c)]).sort((a,b)=>b[1]-a[1]);
  if(cc[0][1])ins.push(['많이 팔린 분류',`${cc[0][0]} ${cc[0][1]}건${cc[1][1]?` · ${cc[1][0]} ${cc[1][1]}건`:''}`]);
  const none=cnt(l,x=>typ(x)==='구분없음');
  if(none)ins.push(['확인 필요',`신규·재결제가 모두 0인 결제 ${none}건`]);
  document.getElementById('yfIns').innerHTML=ins.map(([t,s])=>`<li><i>${t}</i><div>${[].concat(s).join('')}</div></li>`).join('');

  const all4=YF.filter(x=>WEEKS.includes(x[0]));
  const rows=CATS.map(c=>({c,n:cnt(l,x=>x[6]===c),t:cnt(all4,x=>x[6]===c)})).sort((a,b)=>b.t-a.t);
  const mx=Math.max(1,...rows.map(r=>r.t));
  document.getElementById('yfCat').innerHTML=rows.map(r=>`<div class="r"><span>${r.c}</span><div class="tr"><s style="width:${r.t/mx*100}%"></s><i style="width:${r.n/mx*100}%"></i></div><span class="v"><b>${r.n}</b> / ${r.t}</span></div>`).join('');

  // 주차별 가격대 누적 막대
  const W=520,H=210,L=44,R=8,T=16,B=26,nW=WEEKS.length,gw=(W-L-R)/nW,bw=Math.min(44,gw-36);
  const tot=WEEKS.map(wk=>sum(yfWeek(wk))),max=Math.ceil(Math.max(...tot,1)/1e5)*1e5,y=q=>T+(1-q/max)*(H-T-B);
  let g='';
  for(let t=0;t<=4;t++){const q=max*t/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(q)}" y2="${y(q)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(q)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(q/1e4)}</text>`}
  WEEKS.forEach((wk,i)=>{const x=L+gw*i+(gw-bw)/2,on=i===wi;let base=0;
    PRICE.forEach(([pr,lb,col],j)=>{const it=yfWeek(wk).filter(z=>z[1]===pr),q=sum(it);if(!q)return;
      g+=`<rect x="${x}" y="${y(base+q)}" width="${bw}" height="${y(base)-y(base+q)}" fill="${on?col:['#f0f0f0','#e3e3e3','#cfcfcf'][j]}"><title>${wkLabel(wk)} ${lb} ${it.length}건 · ${won(q)}원</title></rect>`;base+=q});
    g+=`<text x="${x+bw/2}" y="${y(base)-6}" text-anchor="middle" font-size="11" fill="${on?'var(--fg)':'var(--mute)'}" font-weight="${on?600:400}">${Math.round(base/1e4)}</text><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="${on?'var(--fg)':'var(--mute)'}" font-weight="${on?600:400}">${wkLabel(wk)}</text>`});
  document.getElementById('yfMix').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:380px;display:block" role="img" aria-label="주차별 결제금액 구성">${g}</svg>`;
  document.getElementById('yfMixLg').innerHTML=PRICE.map(([pr,lb,col])=>`<span><i style="background:${col}"></i>${lb}</span>`).join('');

  const PASS=c=>{c=String(c||'').toUpperCase();if(c==='1MP')return '월정액';if(c==='1ME')return '기업월정액';const m=c.match(/^(\d*)([YMW])/);if(!m)return null;const n=m[1]||'1';return m[2]==='Y'?(n==='1'?'1년':n+'년'):m[2]==='M'?n+'개월':'1주'};
  const PCLS={'월정액':'pm','1년':'py','2년':'p2','1개월':'p1','1주':'pw','기업월정액':'pe'};const PFULL={'월정액':'프리미엄 월정액','1년':'프리미엄 1년','2년':'프리미엄 2년','1개월':'유료 1개월','1주':'유료 1주일','기업월정액':'기업 월정액'};
  const yg={};l.forEach(x=>{const ps=PASS(x[9]),k=x[3]+'|'+typ(x)+'|'+ps,g=yg[k]||(yg[k]={t:x[3],f:x[2],ty:typ(x),ps,code:x[9]||'',n:0,v:0,mx:0});g.n+=x[7]||1;g.v+=x[1];g.mx=Math.max(g.mx,x[1])});
  const yr=Object.values(yg).sort((a,b)=>b.v-a.v||b.n-a.n);
  document.getElementById('yfTblLabel').textContent=`${yr.length}종 · 결제 ${n}건 · 금액 높은 순`;
  document.getElementById('yfTbl').innerHTML=`<thead><tr><th>제목</th><th>파일 등급</th><th>유형</th><th>건수</th><th>금액</th><th>가입 유형</th></tr></thead><tbody>`+
   yr.map(g=>`<tr><td class="tl">${g.t}</td><td>${g.f}</td><td class="${g.ty==='신규'?'hl':''}">${g.ty}</td><td>${g.n}건</td><td class="${g.mx>=110000?'hl':''}">${won(g.v)}</td><td>${g.ps?`<span class="pass ${PCLS[g.ps]||''}" title="${PFULL[g.ps]||g.code}">${g.ps==='기업월정액'?'월정액':g.ps}</span>`:'<span style="color:var(--mute)">-</span>'}</td></tr>`).join('')+'</tbody>';
  // 씨티미디어 스마트스토어 결제 콘텐츠 (상품별)
  const gm={};SSP.filter(x=>monday(x[0])===w).forEach(x=>{const g=gm[x[1]]||(gm[x[1]]=[x[1],0,0,0]);g[1]+=x[2];g[2]+=x[3];g[3]+=x[4]});
  const sl=Object.values(gm).sort((a,b)=>b[3]-a[3]||b[1]-a[1]);
  document.getElementById('ssTblLabel').textContent=sl.length?`${sl.length}종 · 결제 ${sl.reduce((a,x)=>a+x[1],0)}건 · 금액 높은 순`:'';
  document.getElementById('ssTbl').innerHTML=sl.length?`<thead><tr><th>상품명</th><th>결제</th><th>금액</th></tr></thead><tbody>`+
   sl.map(x=>`<tr><td class="tl">${x[0]}</td><td>${x[1]}건</td><td>${won(x[3])}</td></tr>`).join('')+'</tbody>'
   :'<tbody><tr><td style="text-align:center;color:var(--sub);padding:18px">이 주는 상품별 판매 자료가 없습니다</td></tr></tbody>';
}

const wn=document.getElementById('weeks');
wn.innerHTML=WEEKS.map((w,k)=>({w,k})).reverse().map(({w,k})=>`<option value="${k}" ${k===wi?'selected':''}>${(()=>{const m=pd(w),e=new Date(+m+6*864e5),f=d=>`${d.getUTCMonth()+1}. ${d.getUTCDate()}`;return`${m.getUTCFullYear()}. ${f(m)} ~ ${f(e)}`})()}</option>`).join('');
wn.onchange=e=>{wi=+e.target.value;render()};
render();

}

(async()=>{
  let MON=M_SAVED,MSN=MS_SAVED,MCN=MC_SAVED,RAW=RAW_SAVED,YF=YF_SAVED,TASKS=TASKS_SAVED,info='저장된 데이터 표시 중 (시트 미연결)';
  try{
    if(!API_URL.startsWith('https'))throw 0;
    const r=await fetch(API_URL,{cache:'no-store'});const j=await r.json();
    if(!Array.isArray(j.raw)||!Array.isArray(j.yf))throw 0;
    RAW=j.raw;YF=j.yf;TASKS=Array.isArray(j.tasks)?j.tasks:[];if(Array.isArray(j.yft))YFT=j.yft;if(Array.isArray(j.ssp))SSP=j.ssp;if(Array.isArray(j.shop))SHOP=j.shop;if(Array.isArray(j.blog))BLOG=j.blog;if(Array.isArray(j.adsw))ADSW=j.adsw;try{if(j.monthly){const pm=parseMonthly(j.monthly);if(pm.months.length)MON=pm}}catch(e){}try{if(j.sm){const ps=parseSM(j.sm);if(ps.months.length)MSN=ps}}catch(e){}try{if(j.ct){const pc=parseCT(j.ct);if(pc.months.length)MCN=pc}}catch(e){}info=`원본 시트 기준 · ${j.updated} 불러옴`;
  }catch(e){if(API_URL.startsWith('https'))info='시트를 불러오지 못해 저장된 데이터를 표시합니다';}
  start(RAW,YF,info,TASKS);
  startMonthly(MON,MSN,MCN);
})();
</script>
