  ${[['월정액','매월 자동결제',[['프리미엄',o.pm,'#4a86f0'],['기업',o.em,'#b9d0f9']]],['연간','한 번에 1년·2년 결제',[['1년',o.yp+o.yb,'#9466e0'],['2년',o.y2,'#d4c3f4']]],['단기','1주일·1개월만 결제',[['1주일',o.wb,'#76b041'],['1개월',o.mb,'#c6e2a8']]]].map(r=>{const s=r[2].reduce((a,x)=>a+x[1],0),p=s/tot*100;return `<div class="hr"><div class="hl"><b>${r[0]}</b><small>${r[1]}</small></div><div class="ht">${r[2].filter(x=>x[1]).map(x=>`<div class="hf" style="width:${x[1]/tot*100}%;background:${x[3-1]}" title="${x[0]} ${x[1]}건"></div>`).join('')}</div><div class="hv"><b>${p.toFixed(1)}%</b> ${fmt(s)}건</div><div class="hs">${r[2].map(x=>`<span><i style="background:${x[2]}"></i>${x[0]} <b>${fmt(x[1])}건</b> (${tot?(x[1]/tot*100).toFixed(1):0}%)</span>`).join('')}</div></div>`}).join('')}</div></div>`;
}
function mix(f){const v=G.map(g=>[g[0],g[1](f),g[2]]),top=v.slice().sort((a,b)=>b[1]-a[1])[0];
  const tip=T.filter(t=>f[t[0]]).map(t=>t[1]+' '+f[t[0]]).join(' · ');
  return `<div class="mx" title="${tip}"><span class="mt" style="color:${top[2]==='#8fb3f0'?'#3b6fc9':top[2]==='#f0a040'?'#c06a0e':top[2]}">${top[0]} ${Math.round(top[1]/f.n*100)}%</span><span class="mb">${v.filter(x=>x[1]).map(x=>`<i style="flex:${x[1]};background:${x[2]}"></i>`).join('')}</span></div>`}
const KW=[["세트 (공식 11종)", "", 11, 0, 98, 0, 0, 0], ["회사소개서", "", 14, 0, 54, 0, 0, 0], ["사업계획서", "", 20, 0, 72, 0, 0, 0], ["포트폴리오·자소서·이력서", "", 14, 0, 35, 0, 0, 0], ["조직도", "", 14, 0, 31, 0, 0, 0], ["2026·신년도", "", 87, 0, 159, 0, 0, 0], ["제안서·피치덱", "", 51, 0, 80, 0, 0, 0], ["보고서", "", 104, 0, 150, 0, 0, 0], ["시즌·행사", "", 44, 0, 30, 0, 0, 0], ["배경·표지 디자인", "", 73, 0, 29, 0, 0, 0]];
function kwHtml(){const r=KW.slice().sort((a,b)=>b[4]-a[4]),mx=r[0][4];
 return `<div class="card"><div class="hd"><b>주제별 월정액 결제수</b><span>제목 키워드 기준 · 한 서식이 여러 주제에 중복될 수 있음 · <em style="font-style:normal;color:#2f6ad9;font-weight:700">파란색</em> = 서식 1개당 월정액 2건 이상</span></div><div class="kwg">${r.map(x=>`<div class="kr"><span class="kl">${x[0]}</span><div class="kbt"><b>${x[4]}<small>건</small></b><span class="kpc${x[4]/x[2]>=2?' hi':''}">서식 ${x[2]}개<br>1개당 <em>${(Math.round(x[4]/x[2]*100+1e-9)/100).toFixed(2)}건</em></span></div></div>`).join('')}</div></div>`}
let cur='y',ft=-1;
function show(k,f){
  if(k!==cur)ft=-1;cur=k;if(f!==undefined)ft=f;
  tabs.value=String(k);
  document.getElementById('kw').innerHTML=k==='y'?kwHtml():'';
  let rows,tot;
  if(k==='y'){
    tot=D.m.reduce((a,m)=>{for(const x in m)if(x!=='l')a[x]=(a[x]||0)+m[x];return a},{});
    document.getElementById('sum').innerHTML=summary(tot,'연간',`월평균 ${fmt(Math.round(tot.amt/D.m.length))}원`);
    rows=D.f.slice();document.getElementById('lt').textContent='연간 결제 콘텐츠 TOP 50'+(ft<0?'':' · '+F[ft][0]);
    document.getElementById('nt').innerHTML='';
  }else{
    const m=D.m[k],mn=k+1;
    document.getElementById('sum').innerHTML=summary(m,m.l,`결제 콘텐츠 ${D.f.filter(f=>f.m.includes(mn)).length}종`);
    rows=D.f.filter(f=>f.m.includes(mn));document.getElementById('lt').textContent=m.l+' 결제 발생 콘텐츠';
    document.getElementById('nt').innerHTML='<div class="note">※ 원본에 서식별 월간 건수가 없어, 이 달에 결제가 발생한 콘텐츠를 보여주고 건수·금액·유형은 연간 누적값입니다.</div>';
  }
  const base=rows;
  document.getElementById('flt').innerHTML=[['전체',null],...F].map((g,i)=>{const c=g[1]?base.filter(x=>g[1](x)>0).length:base.length;return `<button class="${ft===i-1?'on':''}" onclick="show(cur,${i-1})">${g[0]}<em>${c}</em></button>`}).join('');
  const cf=ft<0?G[0][1]:F[ft][1];
  if(ft>=0)rows=rows.filter(x=>cf(x)>0);
  rows.sort(ft<0?(a,b)=>b.amt-a.amt||b.n-a.n:(a,b)=>cf(b)-cf(a)||b.n-a.n||b.amt-a.amt);
  [0,1,2].forEach(i=>document.getElementById('g'+i).classList.toggle('sel',ft===i));
  const all=rows.length;if(k==='y')rows=rows.slice(0,50);
  document.getElementById('ls').textContent=(k==='y'?`${all}종 중 TOP 50`:`${all}종`)+(ft<0?' · 금액 높은 순':` · ${F[ft][0]} 결제수 많은 순`);
  document.getElementById('tb').innerHTML=rows.map((f,i)=>`<tr><td class="rk">${i+1}</td><td class="l t"><a href="${f.u}" target="_blank" rel="noopener">${f.t}</a></td><td>${f.g}</td>
  <td class="${f.new?'new':''}">${f.new}</td><td>${f.re}</td><td>${f.n}건</td><td class="amt ${f.amt<100000?'lo':''}">${fmt(f.amt)}</td>
  ${G.map((g,j)=>{const v=g[1](f);return `<td class="gc${ft===j?' sel':''}">${v?`<span class="pill p${j}">${v}</span>`:'<span class="zero">–</span>'}</td>`}).join('')}</tr>`).join('');
}
show('y');
</script></body></html>
