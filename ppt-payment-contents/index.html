<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026년 파워포인트 결제 콘텐츠</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--line:#e8eaee;--tx:#222;--sub:#8a8f98;--blue:#3b7ddd;--navy:#2f5bb7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px}.tl{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px}.tr{display:flex;align-items:center;gap:10px}.sheet-btn{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:8px;background:#e8f5ec;color:#1e7e3e;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}.sheet-btn:hover{background:#d6eedd}.desc{color:var(--sub);font-size:12px;margin-bottom:16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;color:#444}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top .desc{margin-bottom:0}
.sel-wrap{position:relative}.sel-wrap:after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid #555;border-bottom:2px solid #555;transform:translateY(-70%) rotate(45deg);pointer-events:none}
#tabs{appearance:none;-webkit-appearance:none;border:1px solid #dcdfe4;background:#fff;border-radius:8px;padding:10px 40px 10px 16px;font:inherit;font-size:14px;font-weight:700;color:#1f2733;cursor:pointer;min-width:190px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.kpi{background:#fff;padding:14px 18px}.kpi .k{color:#555;font-size:14px;font-weight:700}.kpi .v{font-size:20px;font-weight:700;margin-top:2px}.kpi .s{display:none}
.mix{padding:16px 18px;border-top:1px solid var(--line)}.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 10px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#555}.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.hd b{font-size:15px}.hd span{color:var(--sub);font-size:12px}
.note{padding:10px 20px;background:#fafbfc;color:#777;font-size:12px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}
th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #f0f1f4;text-align:right;white-space:nowrap}
th.l,td.l{text-align:left}td.t{white-space:normal;min-width:300px}td.t a{color:inherit;text-decoration:none}td.t a:hover{text-decoration:underline}
td.rk{color:var(--sub);text-align:center;width:44px}th.rk{text-align:center}
.amt{color:var(--blue);font-weight:700}.amt.lo{color:var(--tx);font-weight:400}
.new{color:var(--blue);font-weight:500}
.chip{display:inline-block;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700;margin-left:3px}
.c-mp{background:#2f5bb7;color:#fff}.c-me{background:#1e3a7a;color:#fff}.c-yp{background:#e3edfc;color:#2f5bb7}.c-y2{background:#ede6fb;color:#6b4bc4}.c-yb{background:#e6f4f6;color:#1c7c88}.c-mb{background:#e5f5ea;color:#2a8a4a}.c-wb{background:#fdf0e1;color:#c06a0e}
tr:last-child td{border-bottom:0}
.flt{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.flt button{border:1px solid #dcdfe4;background:#fff;border-radius:20px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;color:#333}
.flt button.on{background:#1f2733;border-color:#1f2733;color:#fff;font-weight:700}
.flt button em{font-style:normal;margin-left:4px}.flt button:nth-child(5){margin-left:auto}
thead th{text-align:center!important}
th.gh,td.gc{text-align:center;width:84px}th.gh small{display:block;font-size:10px;color:#b0b4bb;margin-top:2px}
th.gh{border-left:1px solid #f0f1f4}td.gc{border-left:1px solid #f4f5f7}
th.sel,td.sel{background:#f6f8fc}th.sel{color:#1f2733;font-weight:700}
.pill{display:inline-block;min-width:34px;padding:3px 8px;border-radius:12px;font-weight:700;font-size:13px}
.p0{background:#e3ebfa;color:#2f5bb7}.p1{background:#ede6fb;color:#6b4bc4}.p2{background:#e9f5dc;color:#4f8a1f}.zero{color:#d0d3d8}
.hr{display:grid;grid-template-columns:150px 1fr 120px;grid-template-areas:'l t v' '. s s';align-items:center;column-gap:16px;padding:7px 0;border-bottom:1px dashed #eef0f3}.hr:last-child{border-bottom:0}
.hl{grid-area:l}.hl b{display:block;font-size:14px}.hl small{color:#9aa0a8;font-size:11px}
.ht{grid-area:t;height:12px;background:#f1f3f6;border-radius:6px;overflow:hidden;display:flex}.hf{height:100%;border-radius:0 6px 6px 0;position:relative;z-index:2}.hf+.hf{z-index:1;box-sizing:content-box;padding-left:6px;margin-left:-6px}
.p0f{background:#3b6fd6}.p1f{background:#8b6be0}.p2f{background:#f0a040}
.hv{grid-area:v;text-align:right;color:#666;font-size:12px}.hv b{font-size:16px;color:#1f2733;margin-right:4px}
.hs{grid-area:s;font-size:12px;color:#666;margin-top:3px;display:flex;gap:18px;flex-wrap:wrap}.hs b{color:#1f2733}.hs i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media(max-width:600px){.hr{grid-template-columns:90px 1fr 90px}}
.kwg{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-radius:0 0 12px 12px;overflow:hidden}@media(max-width:1000px){.kwg{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.kwg{grid-template-columns:repeat(2,1fr)}}
.kr{background:#fff;padding:14px 18px;display:flex;flex-direction:column;gap:4px}.kl{font-size:13px;color:#555}.kr b{font-size:22px;color:#1f2733}.kbt{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}.kpc{font-size:12px;color:#9aa0a8;text-align:right;line-height:1.5;margin-left:auto}.kpc em{font-style:normal}.kpc.hi em{color:#2f6ad9;font-weight:700}
.kr b small{font-size:13px;color:#8a8f98;margin-left:2px;font-weight:400}
.kt{height:12px;background:#f1f3f6;border-radius:6px;overflow:hidden}.kt i{display:block;height:100%;background:#4a86f0;border-radius:6px}
.kwsub{font-size:12px;color:#8a8f98;margin-top:4px}
.kwt{min-width:760px}.kwt td{vertical-align:middle}.kwt td.l small{display:block;color:#9aa0a8;font-size:11px;margin-top:2px}
.kwt td:nth-child(3){width:38%}.kb{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:1px;min-width:40px}.kb i{display:block}
.kn{font-size:11px;color:#9aa0a8;margin-top:4px}
.rt{display:inline-block;min-width:52px;text-align:center;padding:3px 8px;border-radius:12px;font-weight:700;background:#f1f3f6;color:#555}.rt.hi{background:#e3edfd;color:#2f6ad9}.rt.lo{background:#f5f5f5;color:#aaa}
.pf{font-size:20px;color:#2f6ad9}.pfu{font-size:12px;color:#8a8f98;margin-left:2px}
.mx{display:flex;align-items:center;justify-content:flex-end;gap:10px}.mt{font-size:12px;font-weight:700;min-width:72px;text-align:right}
.mb{display:flex;width:110px;height:8px;border-radius:4px;overflow:hidden;gap:1px;background:#f0f1f4}.mb i{display:block}
.glg{display:flex;gap:12px;font-size:12px;color:#666}.glg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
</style></head><body><div class="wrap">
<div class="top"><div class="tl"><img src="logo.png" alt="" class="logo"><h1>2026년 파워포인트 결제 콘텐츠</h1></div>
<div class="tr"><div class="sel-wrap"><select id="tabs" onchange="show(this.value==='y'?'y':+this.value)"></select></div><a class="sheet-btn" href="https://docs.google.com/spreadsheets/d/1DyQhQjJrOtkosChFbTTGXCVViVOO-gudneSObG82JPw/edit" target="_blank" rel="noopener">원본 시트 열기</a></div></div>
<div id="load" style="padding:40px 0;text-align:center;color:#8a8f98">데이터 불러오는 중…</div><div id="sum"></div><div id="kw"></div>
<div class="card"><div class="hd"><b id="lt"></b><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span id="ls"></span></div></div><div class="flt" id="flt"></div><div id="nt"></div>
<div class="tw"><table><thead><tr><th class="rk">순위</th><th class="l">제목</th><th>파일 등급</th><th>신규</th><th>재결제</th><th>결제 건수</th><th>결제금액</th><th class="gh" id="g0">월정액</th><th class="gh" id="g1">연간<small>1년·2년</small></th><th class="gh" id="g2">단기<small>1개월·1주</small></th></tr></thead><tbody id="tb"></tbody></table></div></div>
</div>
<script>
const SHEET_ID='1DyQhQjJrOtkosChFbTTGXCVViVOO-gudneSObG82JPw';
let D,KW;
function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}if(c!==''||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>v.trim()!==''))}
function rows(name){return fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(name);return r.text()}).then(t=>{const a=parseCSV(t),h=a.shift().map(x=>x.trim());return a.map(v=>Object.fromEntries(h.map((k,i)=>[k,(v[i]||'').trim()])))})}
const N=v=>+String(v||'0').replace(/[^0-9.\-]/g,'')||0;
Promise.all([rows('콘텐츠'),rows('주제')]).then(([c,k])=>{
  const one=r=>{const p=(r['카테고리명']||'').split('|');return {t:r['제목'],c:p.slice(1).join(' > '),g:r['유/무료'],amt:N(r['결제합(PC+MO)']),n:N(r['결제수(PC+MO)']),new:N(r['신규']),re:N(r['재결제']),mp:N(r['1MP']),me:N(r['1ME']),yp:N(r['1YP']),y2:N(r['2YP']),yb:N(r['1YB']),mb:N(r['1MB']),wb:N(r['1WB']),u:r['url'],id:r['문서번호']}};
  const ppt=c.filter(r=>r['월']&&r['제목']&&(r['사이트명']==='ppt'||(r['카테고리명']||'').startsWith('파워포인트')));
  const mk=[...new Set(ppt.map(r=>r['월']))].sort((a,b)=>{const f=s=>{const x=s.match(/\d+/g)||[0,0];return x.length>1?+x[0]*100+ +x[1]:+x[0]};return f(a)-f(b)});
  const K=['amt','n','new','re','mp','me','yp','y2','yb','mb','wb'];
  const mf=mk.map(m=>ppt.filter(r=>r['월']===m).map(one));
  const agg={};mf.forEach((L,i)=>L.forEach(o=>{const a=agg[o.id]||(agg[o.id]={...o,m:[],...Object.fromEntries(K.map(x=>[x,0]))});K.forEach(x=>a[x]+=o[x]);a.m.push(i+1);a.t=o.t;a.g=o.g;a.c=o.c}));
  D={f:Object.values(agg),mf,m:mk.map((m,i)=>{const o={l:(m.match(/(\d+)\s*월/)||[,m])[1]+'월'};K.filter(x=>x!=='new'&&x!=='re').forEach(x=>o[x]=mf[i].reduce((s,r)=>s+r[x],0));return o})};
  TP=k.filter(r=>r['주제']).map(r=>[r['주제'],(r['키워드']||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),N(r['서식수'])]);
  document.getElementById('load').remove();
  const s=document.createElement('script');s.textContent=document.getElementById('app').textContent;document.body.appendChild(s);
}).catch(()=>{document.getElementById('load').innerHTML='데이터를 불러오지 못했어요. 구글 시트가 <b>링크가 있는 모든 사용자 보기</b>로 공유돼 있는지 확인해 주세요.'});
let TP=[];
function topicKW(L){return TP.filter(t=>t[2]>0).map(t=>[t[0],'',t[2],0,L.filter(f=>{const s=(f.t||'').toLowerCase();return t[1].some(w=>s.includes(w))}).reduce((a,f)=>a+f.mp,0),0,0,0])}
</script>
<script type="text/plain" id="app">
[...D.f,...D.m,...D.mf.flat()].forEach(o=>{o.pm=o.mp;o.em=o.me;o.mp+=o.me;o.me=0});
const G=[['월정액',o=>o.mp,'#2f5bb7'],['연간',o=>o.yp+o.y2+o.yb,'#8fb3f0'],['단기',o=>o.mb+o.wb,'#f0a040']];
const F=[...G.map(g=>[g[0],g[1]]),['신규',o=>o.new],['재결제',o=>o.re]];
const T=[['mp','월정액','#2f5bb7'],['yp','1년','#7ea6ea'],['y2','2년','#8b6be0'],['yb','유료1년','#2aa3b2'],['mb','1개월','#3fae63'],['wb','1주','#f0a040']];
const fmt=n=>n.toLocaleString('ko-KR');
const tabs=document.getElementById('tabs');
const keys=['y',...D.m.map((_,i)=>i)];
keys.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k==='y'?'2026년 전체':'2026년 '+D.m[k].l;tabs.appendChild(o)});
function summary(o,label,extra){
  const tot=o.n,grp=[['월정액',o.mp+o.me],['연간',o.yp+o.y2+o.yb],['단기',o.mb+o.wb]];
  return `<div class="card"><div class="kpis">
  <div class="kpi"><div class="k">매출</div><div class="v">${fmt(o.amt)}원</div><div class="s">${extra||''}</div></div>
  <div class="kpi"><div class="k">결제수</div><div class="v">${fmt(tot)}건</div><div class="s">객단가 ${fmt(Math.round(o.amt/tot))}원</div></div>
  ${grp.map(g=>`<div class="kpi"><div class="k">${g[0]==='월정액'?'월정액수':g[0]+' 결제수'}</div><div class="v">${fmt(g[1])}건</div><div class="s">${(g[1]/tot*100).toFixed(1)}%</div></div>`).join('')}
  </div><div class="mix"><div style="font-size:14px;font-weight:700;color:#555;margin-bottom:2px">결제 유형별 비중</div>
  ${[['월정액','매월 자동결제',[['프리미엄',o.pm,'#4a86f0'],['기업',o.em,'#b9d0f9']]],['연간','한 번에 1년·2년 결제',[['1년',o.yp+o.yb,'#9466e0'],['2년',o.y2,'#d4c3f4']]],['단기','1주일·1개월만 결제',[['1주일',o.wb,'#76b041'],['1개월',o.mb,'#c6e2a8']]]].map(r=>{const s=r[2].reduce((a,x)=>a+x[1],0),p=s/tot*100;return `<div class="hr"><div class="hl"><b>${r[0]}</b><small>${r[1]}</small></div><div class="ht">${r[2].filter(x=>x[1]).map(x=>`<div class="hf" style="width:${x[1]/tot*100}%;background:${x[3-1]}" title="${x[0]} ${x[1]}건"></div>`).join('')}</div><div class="hv"><b>${p.toFixed(1)}%</b> ${fmt(s)}건</div><div class="hs">${r[2].map(x=>`<span><i style="background:${x[2]}"></i>${x[0]} <b>${fmt(x[1])}건</b> (${tot?(x[1]/tot*100).toFixed(1):0}%)</span>`).join('')}</div></div>`}).join('')}</div></div>`;
}
function mix(f){const v=G.map(g=>[g[0],g[1](f),g[2]]),top=v.slice().sort((a,b)=>b[1]-a[1])[0];
  const tip=T.filter(t=>f[t[0]]).map(t=>t[1]+' '+f[t[0]]).join(' · ');
  return `<div class="mx" title="${tip}"><span class="mt" style="color:${top[2]==='#8fb3f0'?'#3b6fc9':top[2]==='#f0a040'?'#c06a0e':top[2]}">${top[0]} ${Math.round(top[1]/f.n*100)}%</span><span class="mb">${v.filter(x=>x[1]).map(x=>`<i style="flex:${x[1]};background:${x[2]}"></i>`).join('')}</span></div>`}

function kwHtml(){const r=KW.slice().sort((a,b)=>b[4]-a[4]),mx=r[0][4];
 return `<div class="card"><div class="hd"><b>주제별 월정액 결제수</b><span>제목 키워드 기준 · 한 서식이 여러 주제에 중복될 수 있음 · <em style="font-style:normal;color:#2f6ad9;font-weight:700">파란색</em> = 서식 1개당 월정액 2건 이상</span></div><div class="kwg">${r.map(x=>`<div class="kr"><span class="kl">${x[0]}</span><div class="kbt"><b>${x[4]}<small>건</small></b><span class="kpc${x[4]/x[2]>=2?' hi':''}">서식 ${x[2]}개<br>1개당 <em>${(Math.round(x[4]/x[2]*100+1e-9)/100).toFixed(2)}건</em></span></div></div>`).join('')}</div></div>`}
let cur='y',ft=-1;
function show(k,f){
  if(k!==cur)ft=-1;cur=k;if(f!==undefined)ft=f;
  tabs.value=String(k);
  KW=topicKW(k==='y'?D.f:D.mf[k]);document.getElementById('kw').innerHTML=KW.length?kwHtml():'';
  let rows,tot;
  if(k==='y'){
    tot=D.m.reduce((a,m)=>{for(const x in m)if(x!=='l')a[x]=(a[x]||0)+m[x];return a},{});
    document.getElementById('sum').innerHTML=summary(tot,'연간',`월평균 ${fmt(Math.round(tot.amt/D.m.length))}원`);
    rows=D.f.slice();document.getElementById('lt').textContent='연간 결제 콘텐츠 TOP 50'+(ft<0?'':' · '+F[ft][0]);
    document.getElementById('nt').innerHTML='';
  }else{
    const m=D.m[k];
    document.getElementById('sum').innerHTML=summary(m,m.l,`결제 콘텐츠 ${D.mf[k].length}종`);
    rows=D.mf[k].slice();document.getElementById('lt').textContent=m.l+' 결제 콘텐츠'+(ft<0?'':' · '+F[ft][0]);
    document.getElementById('nt').innerHTML='';
  }
  const base=rows;
  document.getElementById('flt').innerHTML=[['전체',null],...F].map((g,i)=>{const c=g[1]?base.filter(x=>g[1](x)>0).length:base.length;return `<button class="${ft===i-1?'on':''}" onclick="show(cur,${i-1})">${g[0]}<em>${c}</em></button>`}).join('');
  const cf=ft<0?G[0][1]:F[ft][1];
  if(ft>=0)rows=rows.filter(x=>cf(x)>0);
  rows.sort(ft<0?(a,b)=>b.amt-a.amt||b.n-a.n:(a,b)=>cf(b)-cf(a)||b.n-a.n||b.amt-a.amt);
  [0,1,2].forEach(i=>document.getElementById('g'+i).classList.toggle('sel',ft===i));
  const all=rows.length;if(k==='y')rows=rows.slice(0,50);
  document.getElementById('ls').textContent=(k==='y'?`${all}종 중 TOP 50`:`${all}종`)+(ft<0?' · 금액 높은 순':` · ${F[ft][0]} 결제수 많은 순`);
  document.getElementById('tb').innerHTML=rows.map((f,i)=>`<tr><td class="rk">${i+1}</td><td class="l t"><a href="${f.u}" target="_blank" rel="noopener">${f.t}</a></td><td>${f.g}</td>
  <td class="${f.new?'new':''}">${f.new}</td><td>${f.re}</td><td>${f.n}건</td><td class="amt ${f.amt<100000?'lo':''}">${fmt(f.amt)}</td>
  ${G.map((g,j)=>{const v=g[1](f);return `<td class="gc${ft===j?' sel':''}">${v?`<span class="pill p${j}">${v}</span>`:'<span class="zero">–</span>'}</td>`}).join('')}</tr>`).join('');
}
show('y');
</script></body></html>
